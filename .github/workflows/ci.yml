# 每次推送 / PR 自动跑类型检查、单元测试和生产构建（只检查，不部署）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 只做检查不部署：跳过抠图模型的下载（约 285 MB），应用会按没有本地模型的情况构建
      BG_ASSETS_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

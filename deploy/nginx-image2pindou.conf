# /etc/nginx/sites-available/image2pindou.conf
# 拼豆图纸工坊 — 纯静态 SPA（Vite 构建产物），源站位于 Cloudflare 橙云代理之后。
#
# 端口说明：
#   - fanni-panda.com 这个 zone 没有 Origin Rule，Cloudflare 默认用 443 回源。
#   - 本机 443 空闲（Xray/VPN 跑在另一台 VPS），故 pindou 直接监听 443，无需任何 CF 面板改动。
#   - Cloudflare SSL/TLS 模式设为 Full (strict) 即信任 CF Origin 证书。
#
# 如何在本机再加一个 fanni-panda 子域站（例如 cpa.fanni-panda.com）：
#   1) 复制本文件为 /etc/nginx/sites-available/<站名>.conf
#   2) 改 server_name、root；去掉 default_server（保留给本站即可，新站走 SNI 命名匹配）
#   3) 443 server 块里保留 `include snippets/fanni-panda-tls.conf;`（通配符证书已覆盖所有子域）
#   4) ln -s 到 sites-enabled/，nginx -t && systemctl reload nginx

# ---- HTTP :80 —— 直连 IP 访问 + 兜底（域名访问已由 Cloudflare 边缘强制 HTTPS）----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/image2pindou;
    index index.html;

    location = /sw.js          { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location = /registerSW.js  { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---- HTTPS :443 —— Cloudflare 回源（Full strict 信任 CF Origin 证书）----
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name pindou.fanni-panda.com;

    # 共享通配符证书（*.fanni-panda.com）+ SSL 参数
    include snippets/fanni-panda-tls.conf;

    root /var/www/image2pindou;
    index index.html;

    charset utf-8;
    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Service Worker 与注册脚本不缓存，保证更新能下发
    location = /sw.js          { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location = /registerSW.js  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }

    # 带 hash 的构建产物可长期不可变缓存（exact-match 的 sw.js/registerSW.js 优先级更高，不受影响）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/image2pindou.access.log;
    error_log  /var/log/nginx/image2pindou.error.log warn;
}

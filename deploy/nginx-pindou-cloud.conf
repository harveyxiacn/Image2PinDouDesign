# Include inside the existing pindou HTTPS server only.
# The legacy LAN Hub is deliberately not proxied.
location ^~ /cloud-api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    client_max_body_size 5m;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /warehouse { return 308 /warehouse/; }
location ^~ /warehouse/ {
    root /var/www/image2pindou;
    try_files $uri $uri/ /warehouse/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
# Explicitly refuse accidental forwarding of the LAN namespace.
location ^~ /api/ { return 404; }

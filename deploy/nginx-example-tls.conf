# /etc/nginx/snippets/example-tls.conf
#
# 复用型 TLS 片段：example.com 这个 zone 下的所有子域站点共用同一张
# Cloudflare Origin 通配符证书（*.example.com，15 年有效）。
#
# 新增子域站点时，在它的 443 server 块里写一行：
#     include snippets/example-tls.conf;
# 即可，不必重复粘贴证书与 SSL 参数。

ssl_certificate     /etc/ssl/example/origin.crt;
ssl_certificate_key /etc/ssl/example/origin.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
